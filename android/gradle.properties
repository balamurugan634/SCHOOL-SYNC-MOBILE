# Memory-capped on purpose. Flutter's template ships -Xmx8G (+ a separate Kotlin daemon), which together with an emulator,
# test runs and a dev server exhausted a 16 GB dev machine and froze it. Raise only on a dedicated build machine.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon.idletimeout=120000
# compile Kotlin inside the Gradle daemon instead of spawning a second big JVM
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
